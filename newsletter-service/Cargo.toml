[package]
name = "newsletter-service"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Self-hosted email subscription backend for the site. Runs on a VPS, sends via Cloudflare Email Service."
publish = false

[dependencies]
# Async runtime + web framework (well-tested, widely deployed).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "timeout", "set-header", "limit"] }

# Storage: SQLite via rusqlite (bundled libsqlite3), one mutex-guarded connection.
rusqlite = { version = "0.32", features = ["bundled"] }

# Outbound HTTP (Cloudflare Email Service, Turnstile) over rustls — no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Markdown rendering for post bodies.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Serialization, time, crypto helpers.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
base64 = "0.22"
subtle = "2"           # constant-time comparison for admin tokens
sha2 = "0.10"          # fixed-length hashing so token compare leaks no length
hmac = "0.12"          # signed admin session cookies
flate2 = "1"           # gzip for database backups

# Config + logging.
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling.
anyhow = "1"

[profile.release]
# Hardening: abort on panic rather than unwinding — a panicked worker never
# leaves the process in a half-defined state; systemd restarts it cleanly.
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
